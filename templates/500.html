{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center py-5">
            <div class="mb-4">
                <i class="bi bi-exclamation-octagon display-1 text-danger"></i>
            </div>
            <h1 class="display-1 fw-bold text-muted">500</h1>
            <h2 class="mb-3">Internal Server Error</h2>
            <p class="text-muted mb-4">Something went wrong on our end. Please try again later.</p>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
                <i class="bi bi-house me-1"></i>Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
