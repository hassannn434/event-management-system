{% extends "base.html" %}
{% block title %}Login - EventHub{% endblock %}

{% block public_content %}
<div class="d-flex align-items-center justify-content-center py-5">
    <div class="card shadow-lg login-card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-calendar-event-fill text-primary" style="font-size: 3rem;"></i>
                <h3 class="mt-2 fw-bold">Welcome Back</h3>
                <p class="text-muted">Sign in to your EventHub account</p>
            </div>

            <form method="POST" novalidate>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Login As</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                        <select class="form-select" name="role" required>
                            <option value="" selected disabled>Select Role</option>
                            <option value="admin">Admin</option>
                            <option value="user">User</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" name="email" placeholder="Enter email" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" name="password" placeholder="Enter password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <div class="text-center mt-3">
                <p class="mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-decoration-none">Sign Up</a></p>
            </div>

            <div class="mt-4 p-3 bg-light rounded">
                <small class="text-muted d-block fw-semibold mb-1">Demo Credentials:</small>
                <small class="text-muted d-block">Admin: <strong>admin@events.com</strong> / <strong>admin123</strong></small>
                <small class="text-muted d-block">User: <strong>john@email.com</strong> / <strong>user123</strong></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
